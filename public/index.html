<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice Generator</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23B04A2F'/><text x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='Georgia'>$</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Invoices</h1>
    <div class="actions">
      <button type="button" id="new-invoice" class="secondary" title="Next number, today's date, same details">New invoice</button>
      <button type="button" id="download" class="primary">Download PDF</button>
    </div>
  </header>

  <p id="lang-warning" class="lang-warning" role="status" hidden></p>

  <main class="layout">
    <form id="form" class="editor" autocomplete="off">
      <section>
        <h2>Invoice</h2>
        <div class="grid three">
          <label>Number <input data-path="number"></label>
          <label>Date <input type="date" data-path="date"></label>
          <label>Due date <input type="date" data-path="dueDate"></label>
        </div>
      </section>

      <section>
        <h2>From</h2>
        <label>Name / company <input data-path="sender.name" placeholder="IE Ivan Petrov"></label>
        <label>Email, address, details <span class="hint">one per line</span>
          <textarea data-path="sender.details" rows="3" placeholder="you@example.com&#10;Street, City, Country"></textarea>
        </label>
      </section>

      <section>
        <h2>Bill to</h2>
        <label>Company <input data-path="client.name" placeholder="Acme Inc."></label>
        <label>EIN, address <span class="hint">one per line</span>
          <textarea data-path="client.details" rows="4" placeholder="EIN: 12-3456789&#10;100 Main Street&#10;Phoenix AZ 85016, USA"></textarea>
        </label>
      </section>

      <section>
        <h2>Work</h2>
        <div class="items-head" aria-hidden="true">
          <span>Description</span><span>Hours</span><span>Rate</span><span>Amount</span><span></span>
        </div>
        <div id="items"></div>
        <button type="button" id="add-item" class="link">+ Add line</button>
        <div class="grid two totals-row">
          <label>Tax, % <input type="number" step="0.01" min="0" data-path="taxPercent"></label>
          <div class="total-box">Total <strong id="total">—</strong></div>
        </div>
      </section>

      <section>
        <h2>Notes</h2>
        <label>Payment details, comments <span class="hint">optional</span>
          <textarea data-path="notes" rows="3" placeholder="Bank: …&#10;IBAN: …&#10;SWIFT: …"></textarea>
        </label>
      </section>

      <details>
        <summary>Style and PDF labels</summary>
        <div class="grid three">
          <label>Currency <input data-path="currency" list="currencies" maxlength="3"></label>
          <label>Number and date format <input data-path="locale" list="locales"></label>
          <label>Accent color <input type="color" data-path="accentColor"></label>
        </div>
        <div class="grid three labels">
          <label>Title <input data-path="labels.title"></label>
          <label>Invoice number <input data-path="labels.invoiceNumber"></label>
          <label>Date <input data-path="labels.date"></label>
          <label>Due date <input data-path="labels.dueDate"></label>
          <label>Bill to <input data-path="labels.billTo"></label>
          <label>Item <input data-path="labels.item"></label>
          <label>Quantity <input data-path="labels.quantity"></label>
          <label>Rate <input data-path="labels.rate"></label>
          <label>Amount <input data-path="labels.amount"></label>
          <label>Subtotal <input data-path="labels.subtotal"></label>
          <label>Tax <input data-path="labels.tax"></label>
          <label>Total <input data-path="labels.total"></label>
          <label>Notes <input data-path="labels.notes"></label>
        </div>
        <button type="button" id="reset-labels" class="link">Reset to default labels</button>
      </details>

      <details id="history-panel">
        <summary>History <span id="history-count" class="hint"></span></summary>
        <p class="hint">Saved when you download a PDF. Data stays in this browser only.</p>
        <ul id="history"></ul>
        <div class="row">
          <button type="button" id="export-json" class="link">Export JSON</button>
          <label class="link file">Import JSON <input type="file" id="import-json" accept="application/json"></label>
        </div>
      </details>
    </form>

    <section class="preview" aria-label="Preview">
      <iframe id="preview" title="PDF preview"></iframe>
      <div id="preview-fallback" class="preview-fallback" hidden>
        <p>This browser can't show PDFs inside the page.</p>
        <button type="button" id="open-preview" class="secondary">Open preview</button>
      </div>
      <p id="status" class="hint"></p>
    </section>
  </main>

  <datalist id="currencies">
    <option value="USD"><option value="EUR"><option value="GBP"><option value="GEL"><option value="RUB">
  </datalist>
  <datalist id="locales">
    <option value="en-US"><option value="en-GB"><option value="de-DE"><option value="ru-RU">
  </datalist>

  <template id="item-row">
    <div class="item">
      <input data-item="description" placeholder="Software development services, September 2026" aria-label="Description">
      <input data-item="quantity" type="number" step="0.25" min="0" placeholder="Hours" aria-label="Hours">
      <input data-item="rate" type="number" step="0.01" min="0" placeholder="Rate" aria-label="Rate">
      <output data-item="amount"></output>
      <button type="button" class="remove" aria-label="Remove line" title="Remove line">×</button>
    </div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
